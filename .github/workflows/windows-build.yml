name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dango-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Restore cached FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: .ffmpeg-cache
          key: ffmpeg-windows-x64-gpl-2026-11-02-v1
      - name: Download FFmpeg on cache miss
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cache = Join-Path $PWD '.ffmpeg-cache'
          $archive = Join-Path $env:RUNNER_TEMP 'dango-ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'dango-ffmpeg'
          New-Item -ItemType Directory -Force -Path $cache, $extract | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-02-12-51/ffmpeg-n9.0.2-45-g1e65c6cd5d-win64-gpl-9.0.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -LiteralPath $extract -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $extract -Filter 'ffprobe.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe' }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $cache 'ffmpeg.exe')
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $cache 'ffprobe.exe')
          $license = Get-ChildItem -LiteralPath $extract -Filter 'LICENSE*' -Recurse | Select-Object -First 1
          if ($license) { Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $cache 'FFmpeg-LICENSE.txt') }
      - name: Verify cached FFmpeg tools
        shell: pwsh
        run: |
          if (-not (Test-Path '.ffmpeg-cache/ffmpeg.exe') -or -not (Test-Path '.ffmpeg-cache/ffprobe.exe')) { throw 'Cached FFmpeg tools are missing' }
          & '.ffmpeg-cache/ffmpeg.exe' -version | Select-Object -First 1
      - name: Check frontend syntax
        run: node --check frontend/app.js
      - name: Check effect module syntax
        run: node --check frontend/effects/index.js
      - name: Validate app configuration
        run: node -e "const fs=require('fs'); for(const file of ['package.json','src-tauri/tauri.conf.json','src-tauri/capabilities/default.json']) JSON.parse(fs.readFileSync(file,'utf8'))"
      - name: Install frontend tooling
        run: npm install
      - name: Prepare cream installer artwork
        shell: pwsh
        run: ./scripts/create-installer-art.ps1
      - name: Build Dango MSI installer
        run: npm run tauri -- build --bundles msi
      - name: Upload the MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Dango-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14