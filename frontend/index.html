<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8eaf5"><title>Dango</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand-wrap"><button class="brand" id="brand" title="Dango menu"><img src="./icons/Dango.ico" alt="Dango"></button><div class="brand-menu" id="brandMenu" hidden><button data-action="new">New project</button><button data-action="open">Open project</button><button data-action="save">Save project</button><button data-action="save-as">Save as…</button><button data-action="settings">Settings</button><button data-action="exit">Exit</button></div></div>
    <div class="project-title" data-tauri-drag-region><span id="projectName">Untitled project</span><i id="projectDirty" title="Saved"></i></div><button id="exportOpen" class="export-button">Export</button><div class="window-buttons"><button data-window="minimize" title="Minimize">−</button><button data-window="toggle-maximize" title="Maximize">□</button><button data-window="close" title="Close">×</button></div>
  </header>
  <section class="editor">
    <div class="top-workspace">
      <nav class="toolrail" aria-label="Tools"><div class="history-tools"><button id="undoButton" title="Undo · Shift+Z" aria-label="Undo" disabled>↶</button><button id="redoButton" title="Redo · Shift+Ctrl+Z" aria-label="Redo" disabled>↷</button></div><button class="tool active" data-tool="select" title="Select (V)"><img src="./icons/icons8-cursor-24.ico" alt="Select"></button><button class="tool" data-tool="blade" title="Blade (C)"><img src="./icons/icons8-blade-50.ico" alt="Blade"></button><button class="tool" data-tool="hand" title="Hand (H)"><img src="./icons/icons8-hand-50.ico" alt="Hand"></button><button class="tool text-tool" data-tool="text" title="Text (T)"><span>T</span></button></nav>
      <section class="viewer panel"><div class="viewer-head"><span class="mini-label">VIEWER</span><span class="head-spacer"></span><button class="quiet-button" id="fitPreview" title="Toggle fit / fill">⛶</button></div><div class="stage"><canvas id="previewCanvas" aria-label="Video preview"></canvas><video id="videoPreview" playsinline aria-hidden="true"></video><div class="title-preview" id="titlePreview"></div><div class="text-drag-box" id="textDragBox" hidden></div><div class="preview-transform-box" id="previewTransformBox" hidden><i class="transform-rotate" data-transform="rotate"></i><i class="transform-handle nw" data-transform="resize"></i><i class="transform-handle ne" data-transform="resize"></i><i class="transform-handle sw" data-transform="resize"></i><i class="transform-handle se" data-transform="resize"></i></div><div class="black-fade" id="blackFade"></div><div class="vignette" id="vignette"></div><div class="play-cover" id="playCover"><button id="bigPlay" class="big-play" aria-label="Play">▶</button></div></div><div class="transport"><div class="transport-buttons"><button id="stepBack" title="Previous frame">|◀</button><button class="play-small" id="playToggle" title="Play / pause">▶</button><button id="stepForward" title="Next frame">▶|</button></div><span class="timecode" id="timecode">00:00:00:00 <i>/</i> 00:00:00:00</span><label class="preview-speed">Preview <select id="previewSpeed" aria-label="Preview resolution"><option value="1">1× · Full</option><option value="0.5" selected>0.5× · Half</option><option value="0.25">0.25× · Quarter</option></select></label></div></section>
      <div class="splitter vertical" id="splitVertical" title="Drag to resize panels"><span></span></div>
      <aside class="inspector panel"><div class="tabs"><button class="tab active" data-tab="kontrol">Controls</button><button class="tab" data-tab="effectz">Effects</button><button class="tab" data-tab="media">Media</button></div><div class="inspector-body" id="inspectorBody"></div></aside>
    </div>
    <div class="splitter horizontal" id="splitHorizontal" title="Drag to resize timeline"><span></span></div>
    <section class="timeline panel"><div class="timeline-top"><div class="sequence"><span class="mini-label">TIMELINE</span><span class="sequence-name">Main sequence</span></div><div class="timeline-tools"><button id="zoomMinus">−</button><input id="zoom" type="range" min="30" max="90" value="48" aria-label="Timeline zoom"><button id="zoomPlus">+</button></div></div><div class="timeline-viewport" id="timelineViewport"><div class="timeline-content" id="timelineContent"><div class="ruler"><div class="track-name ruler-name"></div><div class="ticks" id="ticks"></div></div><div id="timelineRows"></div><div class="playhead" id="playhead"><button class="playhead-handle" id="playheadHandle" aria-label="Drag playhead"></button></div></div></div><div class="timeline-footer" aria-hidden="true"></div></section>
  </section><div class="toast" id="toast"></div>
</main><div id="clipContextMenu" class="clip-context-menu" hidden role="menu"></div><div class="modal-backdrop" id="exportModal" hidden><section class="settings-modal export-modal"><header><strong>Export video</strong><button id="closeExport" aria-label="Close export">×</button></header><p>Render the timeline to an MP4 with FFmpeg.</p><label class="export-field">Resolution and quality<select id="exportQuality"><option value="480-low">480p · Low quality · smaller file</option><option value="480-medium">480p · Medium quality</option><option value="480-high">480p · High quality</option><option value="720-low">720p · Low quality · smaller file</option><option value="720-medium" selected>720p · Medium quality</option><option value="720-high">720p · High quality</option><option value="1080-low">1080p · Low quality · smaller file</option><option value="1080-medium">1080p · Medium quality</option><option value="1080-high">1080p · High quality</option></select></label><p id="exportStatus" class="export-status" role="status" aria-live="polite" hidden></p><div class="export-actions"><button id="cancelExport">Cancel</button><button id="startExport" class="export-primary">Export MP4</button></div></section></div><div class="modal-backdrop" id="settingsModal" hidden><section class="settings-modal"><header><strong>Settings</strong><button id="closeSettings" aria-label="Close settings">×</button></header><h3>Keyboard shortcuts</h3><div class="shortcut-row"><span>Select</span><input data-shortcut="select" value="V" maxlength="1"></div><div class="shortcut-row"><span>Blade</span><input data-shortcut="blade" value="C" maxlength="1"></div><div class="shortcut-row"><span>Hand</span><input data-shortcut="hand" value="H" maxlength="1"></div><div class="shortcut-row"><span>Text</span><input data-shortcut="text" value="T" maxlength="1"></div><p>Choose a shortcut and press the key in its field.</p></section></div><svg class="filter-defs" aria-hidden="true"><filter id="dango-swirl" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="5" result="noise"/><feDisplacementMap id="swirl-scale" in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="dango-wave" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="turbulence" baseFrequency=".002 .035" numOctaves="1" seed="2" result="wave"/><feDisplacementMap id="wave-scale" in="SourceGraphic" in2="wave" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter></svg><script type="module" src="./app.js"></script></body></html>
